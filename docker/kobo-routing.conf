# Reverse proxy for the single-domain, two-frontend arrangement (§D34).
#
# Both frontends answer the same URLs on the same host; this file is what picks
# between them. It is also the second copy of a rule that also lives in
# `kobo-frontend/src/lib/ui-choice.ts` — unavoidable, because the choice has to
# be made before a request reaches either application, and only the proxy is
# there. The spec file next to that module and the maps below are meant to be
# changed together.
#
# One origin is not an aesthetic preference. The session cookie is set without
# a `Domain` attribute (`backend/src/auth/session.ts`), so it is host-only: a
# second hostname for the Kobo interface would receive no session at all.

upstream bookcsi_api {
    server 127.0.0.1:3000;
}

upstream bookcsi_kobo {
    server 127.0.0.1:4000;
}

# Step 1: an explicit pin, set by /ui/lite and /ui/full. Empty when unset.
map $cookie_ui $ui_from_cookie {
    default  "";
    "lite"   "lite";
    "full"   "full";
}

# Step 2: the User-Agent sniff. Kobo appends the model in parentheses —
# "(Kobo Libra Colour)" — so the brand name is the whole signal. Kept
# deliberately narrow: sending a real browser to the JS-less interface is a
# worse failure than sending a Kobo to the SPA, which at least shows something.
map $http_user_agent $ui_from_agent {
    default       "full";
    "~*\bkobo\b"  "lite";
}

# Step 3: the cookie wins when it is set, otherwise the User-Agent decides.
# nginx takes the first matching entry, so the two cookie patterns are listed
# before the agent one.
map "$ui_from_cookie:$ui_from_agent" $ui {
    default     "full";
    "~^lite:"   "lite";
    "~^full:"   "full";
    "~^:lite$"  "lite";
}

server {
    listen 443 ssl;
    server_name bookcsi.example;

    # ssl_certificate / ssl_certificate_key go here.
    #
    # Worth checking against the device before anything else: the Kobo browser
    # ships an old TLS stack, and if it cannot complete a handshake with this
    # server then no amount of HTML work matters. That is the first question
    # /probe answers.

    root /srv/bookcsi/frontend;   # the built SPA, `npm run build`

    # The API. Prefixed here, unprefixed upstream — Nest still mounts its
    # routes at the root. `GOOGLE_CALLBACK_URL` in backend/.env must be the
    # public form of this path, and the same URL must be listed in the Google
    # console, or the OAuth round trip fails on the way back.
    location /api/ {
        proxy_pass http://bookcsi_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The interface switch and the probe always go to the Kobo app, whichever
    # interface the maps above would otherwise pick. Without this, /ui/full is
    # unreachable from a device currently pinned to lite — the escape hatch
    # would be locked from the inside.
    location ~ ^/(ui|probe)(/|$) {
        proxy_pass http://bookcsi_kobo;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # `if` cannot safely wrap `proxy_pass`, so the branch is expressed as
        # an internal redirect to a named location instead. This is the
        # standard idiom for exactly this situation.
        error_page 418 = @kobo;
        recursive_error_pages on;

        if ($ui = "lite") {
            return 418;
        }

        # The SPA: a client-routed application, so unknown paths are its
        # problem, not nginx's.
        try_files $uri $uri/ /index.html;

        # The static half has no application to set this for it. Two different
        # documents answer this URL depending on the request headers, so any
        # cache in front that ignores that will eventually hand the React shell
        # to an e-reader. The Kobo app sets the same header itself.
        add_header Vary "User-Agent, Cookie" always;
    }

    location @kobo {
        proxy_pass http://bookcsi_kobo;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
