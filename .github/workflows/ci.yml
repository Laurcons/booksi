name: CI

# Every push and every pull request. The point of this file is that nothing
# here depends on somebody remembering to run it: the `typecheck` script added
# after the specs were found to be compiled by nothing only helps if something
# runs it, and until this workflow existed nothing did.
on:
  push:
  pull_request:

jobs:
  # Types, lint, unit tests and a production build. No database, so this stays
  # fast and is the job that gates most mistakes.
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # `npm ci` over `npm install`: it installs the lockfile exactly and fails
      # if package.json has drifted from it, which is the check a CI run wants.
      - run: npm ci

      # `shared/` is consumed through its built output, so both workspaces need
      # it on disk before anything else can be type-checked.
      - run: npm run build:shared

      # Typechecking imports `@prisma/client`'s generated types directly, so
      # they have to exist on disk before `lint`/`test` run — nothing else in
      # this job touches a database, so `generate` (not `migrate deploy`) is
      # all that's needed.
      - run: npm run prisma:generate --workspace backend

      # `npm test` type-checks both workspaces before running anything — see
      # the note in backend/tsconfig.spec.json for why that lives in the test
      # script rather than in the test runner.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The end-to-end suite drives a real browser against a real stack, so it gets
  # a job of its own: it needs MariaDB, a migrated schema and both services
  # running, and none of that should slow down the check above.
  e2e:
    runs-on: ubuntu-latest
    needs: check

    services:
      db:
        image: mariadb:11
        env:
          MARIADB_DATABASE: bookcsi
          MARIADB_USER: bookcsi
          MARIADB_PASSWORD: bookcsi_dev
          MARIADB_ROOT_PASSWORD: root_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build:shared

      # The API validates its environment at boot and refuses to start without
      # it (D-note in config/env.ts), so the file has to exist before anything
      # is launched. The secrets are throwaway: this database is destroyed with
      # the runner, and Google is never actually contacted — the e2e suite signs
      # its own session rather than logging in.
      - name: Write backend/.env
        run: |
          cat > backend/.env <<'ENV'
          NODE_ENV=development
          PORT=3000
          DATABASE_URL="mysql://bookcsi:bookcsi_dev@127.0.0.1:3306/bookcsi"
          GOOGLE_CLIENT_ID=ci-client-id
          GOOGLE_CLIENT_SECRET=ci-client-secret
          GOOGLE_CALLBACK_URL="http://localhost:3000/auth/google/callback"
          JWT_SECRET=ci-secret-long-enough-to-pass-validation
          WEB_ORIGIN="http://localhost:5173"
          API_ORIGIN="http://localhost:3000"
          TRUST_PROXY=0
          MCP_CLIENT_ID=ci-mcp-client-id
          MCP_CLIENT_SECRET=ci-mcp-client-secret
          MCP_REDIRECT_URIS="http://localhost:5173/mcp/callback"
          ENV

      - run: npm run prisma:deploy --workspace backend

      # Unlike `migrate dev`, `migrate deploy` does not generate the client —
      # it's meant for a deploy pipeline where generation is its own step, so
      # the build below needs this run explicitly (see the `check` job above).
      - run: npm run prisma:generate --workspace backend

      - run: npx playwright install --with-deps chromium

      - run: npm run build --workspace backend
      - name: Start the API
        run: node backend/dist/main.js &

      - run: npm run build --workspace frontend
      - name: Serve the web app on the origin CORS allows
        # Credentialed CORS permits exactly one origin (D20), so this has to be
        # the same :5173 the API was configured with — not vite preview's default.
        run: npx vite preview --port 5173 --strictPort &
        working-directory: frontend

      # `global-setup.ts` fails the run if either service is missing, but it
      # does not wait for them to come up.
      - name: Wait for the stack
        run: npx wait-on http://localhost:3000/docs-json http://localhost:5173 --timeout 60000

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
