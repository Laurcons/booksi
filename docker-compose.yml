services:
  db:
    image: mariadb:11
    container_name: bookcsi-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: bookcsi
      MARIADB_USER: bookcsi
      MARIADB_PASSWORD: bookcsi_dev
      MARIADB_ROOT_PASSWORD: root_dev
    # The default charset varies between MariaDB builds and distributions. A
    # database that silently lands on latin1 only breaks once real titles with
    # diacritics exist, so it is pinned explicitly here.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro

volumes:
  db-data:
